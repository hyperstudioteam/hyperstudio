[package]
name = "hyperstudio"
version = "0.1.5"
description = "An open-source database client for MySQL and PostgreSQL"
authors = ["HyperStudio contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hyperstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "chrono", "uuid", "json", "bigdecimal"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
async-trait = "0.1.91"
zip = { version = "8.6.0", features = ["deflate"] }
async-ssh2-tokio = "0.13.0"
keyring = { version = "4.1.5", features = ["v1"] }
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
