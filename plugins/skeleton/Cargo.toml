[package]
name = "hyperstudio-skeleton"
version = "0.1.0"
edition = "2021"
description = "Minimal HyperStudio driver plugin skeleton (JSON-RPC over stdin/stdout)"
license = "MIT"
publish = false

[[bin]]
name = "hyperstudio-skeleton"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
