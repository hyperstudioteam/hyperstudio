[package]
name = "hyperstudio-typesense"
version = "0.1.0"
edition = "2021"
description = "Typesense driver plugin for HyperStudio"
license = "MIT"
publish = false

[[bin]]
name = "hyperstudio-typesense"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
